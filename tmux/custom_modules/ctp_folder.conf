# vim:set ft=tmux:
%hidden MODULE_NAME='ctp_folder'

# Pastel color unique to this module (not used by session/primary_ip/cpu/
# memory/battery/date_time already on the bar).
set -gqF "@catppuccin_${MODULE_NAME}_color" '#{E:@thm_flamingo}'

# @catppuccin_ctp_folder_flash is empty normally (shows the folder icon and
# the live path); the click handler (scripts/copy_folder_path.sh) sets it to
# "Copied!" (space-padded to the copied path's length, so the pill doesn't
# change width) for ~1.5s as feedback, then clears it back to empty.
# Hardcoding "ctp_folder" below (rather than ${MODULE_NAME}) since this file
# is only ever used for this one module, not shared as a template.
set -gq "@catppuccin_${MODULE_NAME}_flash" ""

set -gq "@catppuccin_${MODULE_NAME}_icon" '#{?@catppuccin_ctp_folder_flash, , }'

# Last few path segments of the focused pane's current directory, unless a
# flash message is active, in which case that's shown instead.
set -gq "@catppuccin_${MODULE_NAME}_text" '#{?@catppuccin_ctp_folder_flash,#{@catppuccin_ctp_folder_flash},#(#{HOME}/.dotfiles/tmux/custom_modules/scripts/folder_path.sh "#{pane_current_path}")}'

set -gqF "@catppuccin_status_${MODULE_NAME}_icon_fg" "#{E:@thm_crust}"
set -gqF "@catppuccin_status_${MODULE_NAME}_text_fg" "#{E:@thm_fg}"
set -gqF "@catppuccin_status_${MODULE_NAME}_icon_bg" "#{@catppuccin_${MODULE_NAME}_color}"
set -gqF "@catppuccin_status_${MODULE_NAME}_text_bg" "#{E:@catppuccin_status_module_text_bg}"

# Built by hand (rather than sourcing utils/status_module.conf) so a
# clickable #[range=user|...] region can wrap the whole icon+path pill.
# tmux has no hover event on the status line (only clicks), so the entire
# pill is the click target rather than a separate hover-revealed button.
#
# The icon and text segments intentionally use plain -ag (no -F): -F bakes
# the referenced value in immediately at config-load time, which would
# freeze them forever and block the click handler from ever swapping in
# the flash via a plain "tmux set-option -g @catppuccin_ctp_folder_flash".
set -gF "@catppuccin_status_${MODULE_NAME}" "#[fg=#{@catppuccin_status_${MODULE_NAME}_icon_bg}]#{@catppuccin_status_left_separator}"
set -agF "@catppuccin_status_${MODULE_NAME}" "#[range=user|folder_copy_btn]"
set -ag "@catppuccin_status_${MODULE_NAME}" "#[fg=#{@catppuccin_status_${MODULE_NAME}_icon_fg},bg=#{@catppuccin_status_${MODULE_NAME}_icon_bg}]#{@catppuccin_${MODULE_NAME}_icon}"
set -agF "@catppuccin_status_${MODULE_NAME}" "#{@catppuccin_status_middle_separator}"
set -agF "@catppuccin_status_${MODULE_NAME}" "#[fg=#{@catppuccin_status_${MODULE_NAME}_text_fg},bg=#{@catppuccin_status_${MODULE_NAME}_text_bg}]"
set -ag "@catppuccin_status_${MODULE_NAME}" " #{@catppuccin_${MODULE_NAME}_text} "
set -agF "@catppuccin_status_${MODULE_NAME}" "#[norange]"
set -agF "@catppuccin_status_${MODULE_NAME}" "#[fg=#{@catppuccin_status_${MODULE_NAME}_text_bg}]#{@catppuccin_status_right_separator}"
