# use UTF8
# set -g utf8
# set-window-option -g utf8 on

# make tmux display things in 256 colors
set -g default-terminal "tmux-256color"

# change the bind key
set -g prefix C-q
unbind q
bind q send-prefix

set -g history-limit 50000

# tmux messages are displayed for 4 seconds
set -g display-time 4000

# reload ~/.tmux.conf using PREFIX r
unbind r
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# change window splitting bindings
unbind %
bind | split-window -h
unbind '"'
bind - split-window -v

# Enable extended key reporting for Claude Code
set -s extended-keys always
set -s extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'


# mouse support
set -g mouse on

# hjkl pane traversal
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind C-h resize-pane -L 4
bind C-j resize-pane -D 2
bind C-k resize-pane -U 2
bind C-l resize-pane -R 4

# emacs key bindings in tmux command prompt (prefix + :) are better than
# vi keys, even for vim users
set -g status-keys emacs

# set default shell to zsh
set-option -g default-shell /bin/zsh

# do not allow tmux to automatically rename windows
set-option -g allow-rename off

# sync all panes
bind y set synchronize-panes\; display 'synchronize-panes #{?synchronize-panes,on,off}'

# cheat sheets: float ~/.dotfiles/docs in nvim over whatever is in the current
# pane (prefix + ?, mirroring nvim's own <leader>? cheat-sheet binding).
#
# display-popup draws a box over the top of the panes and runs its own process
# in it, so nothing is sent to the focused pane's program -- an nvim session, a
# running build or a half-typed shell line is left completely untouched and is
# simply revealed again, unchanged, when the popup goes away. -E closes the
# popup as soon as the nvim inside it exits, so :q lands straight back in what
# was already there. Keys go to the popup's program while a command is running,
# so Escape inside nvim stays Escape rather than dismissing the popup.
#
# The path is expanded by the shell (display-popup runs shell-command through
# default-shell) rather than by -d, which is not documented as format-expanded;
# cd'ing first also gives the popup's nvim the docs dir as its cwd, so telescope
# and :Cheatsheet resolve there. nvim-tree hijacks the directory argument and
# renders the file list to pick from.
#
# This shadows the default prefix + ? (list-keys); it is still reachable as
# `list-keys` from the command prompt (prefix + :).
unbind ?
bind ? display-popup -E -w 80% -h 80% -b rounded -T ' cheat sheets ' 'cd ~/.dotfiles/docs && nvim .'

# Save/restore session with tmux-continuum
set -g @continuum-restore 'on'

# Plugin dir (used by the custom status modules below)
set-environment -gF TMUX_PLUGIN_MANAGER_PATH '#{HOME}/.tmux/plugins/'

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'dreknix/tmux-primary-ip'
set -g @plugin 'catppuccin/tmux#v2.1.3'

#### COLOUR (Catppuccin)
# Status line based on dreknix's config:
# https://github.com/catppuccin/tmux/discussions/317#discussioncomment-10890888
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_number_position 'right'
set -g @catppuccin_window_status 'no'
# show the window name (#W, set via prefix+,) instead of the default
# pane title (#T, which the shell keeps overwriting)
set -g @catppuccin_window_text ' #W'
set -g @catppuccin_window_current_fill 'number'
set -g @catppuccin_window_current_text ' #W'
set -g @catppuccin_window_current_color '#{E:@thm_surface_2}'
set -g @catppuccin_date_time_text ' %d.%m. %H:%M'
# Grey pill body (same grey as the currently-selected window pill's
# @catppuccin_window_current_color above) for the session pill and every
# status-right widget pill, so they read as pills instead of blending into
# the status bar background; each widget keeps its own accent color on the
# icon segment via *_icon_bg, only the text segment uses this.
set -g @catppuccin_status_module_text_bg '#{E:@thm_surface_2}'
# Rounded right cap for those pills, mirroring the reverse-video half-circle
# trick @catppuccin_window_status_style 'rounded' uses for window pills
# above: fg is set to the real status-bar background (thm_mantle) with
# `reverse` so the glyph's ink paints in the pill's still-active bg (grey),
# fading into mantle. The left side intentionally keeps the plain (non-
# reverse) @catppuccin_status_left_separator so each widget's icon cap stays
# colored instead of turning grey.
#
# #[none] alone doesn't reliably fall back to the bar's real background here
# (@catppuccin_status_connect_separator defaults to 'yes', which is exactly
# what keeps modules visually connected instead of resetting bg between
# them) -- verified by capturing raw terminal output and replaying it
# through a VT100 emulator: without an explicit trailing #[fg=..,bg=..],
# the grey pill body leaked into the next module's left cap and into the
# plain space tmux appends after the session module in status-left.
set -g @catppuccin_status_right_separator '#[fg=#{E:@thm_mantle},reverse]#[none]#[fg=#{E:@thm_fg},bg=#{E:@thm_mantle}]'

# Load catppuccin now (before the status-right lines below); tpm still
# manages installs/updates via the @plugin line above
run '~/.tmux/plugins/tmux/catppuccin.tmux'

# load custom status modules (colored CPU / memory / primary IP / folder)
source -F '#{HOME}/.dotfiles/tmux/custom_modules/ctp_cpu.conf'
source -F '#{HOME}/.dotfiles/tmux/custom_modules/ctp_memory.conf'
source -F '#{HOME}/.dotfiles/tmux/custom_modules/primary_ip.conf'
source -F '#{HOME}/.dotfiles/tmux/custom_modules/ctp_folder.conf'

# refresh the status line promptly when focus moves between panes, so the
# folder module's path stays in sync rather than waiting on status-interval
set -g focus-events on
set-hook -g pane-focus-in 'refresh-client -S'

# click anywhere on the folder module's pill to copy the focused pane's
# full current path to the clipboard (the module briefly flashes "Copied!"
# as feedback, since tmux can't detect hover to swap it back on mouse-out);
# anywhere else on the window list falls through to the default switch-client
bind-key -n MouseDown1Status if-shell -F '#{==:#{mouse_status_range},folder_copy_btn}' \
  'run-shell -b "#{HOME}/.dotfiles/tmux/custom_modules/scripts/copy_folder_path.sh \"#{pane_current_path}\" \"#{client_tty}\""' \
  'switch-client -t ='

# keyboard equivalent of that click: prefix + Ctrl-c copies the focused pane's
# full current path, with the same "Copied!" flash on the folder pill. Run
# detached (-b) like the mouse binding, so the flash's sleep doesn't block the
# server for its duration.
bind-key C-c run-shell -b "#{HOME}/.dotfiles/tmux/custom_modules/scripts/copy_folder_path.sh \"#{pane_current_path}\" \"#{client_tty}\""

set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi r send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# pane border
set-option -g pane-border-status top
set-option -g pane-border-format " #{pane_current_path} "

# status bar (explicit position: sourcing the config can't unset a
# previously-set option, so state it rather than rely on the default)
set -g status-position bottom
set -g status-interval 5
set -g status-left-length 100
# Effectively uncapped (32767 is tmux's maximum; there is no "unlimited"
# sentinel -- 0 means zero width). A fixed cap here silently drops the
# rightmost pills, because tmux truncates status-right by keeping its
# leftmost N cells: once the ctp_folder pill's path pushed the total past
# 100, the clock/battery/memory vanished and the straddling pill was cut
# mid-glyph, while the window list expanded to fill the freed space -- which
# looked like the pills had overflowed off the right edge of the screen.
# Uncapped, tmux instead compresses the window list and then trims the *left*
# end of status-right (the folder breadcrumb, already a lossy abbreviation
# and length-capped in folder_path.sh), so the right-hand pills always
# survive. Verified down to an 40-column client.
set -g status-right-length 32767
set -g status-left '#{E:@catppuccin_status_session} '
# Single-space gaps between pills below match tmux's default
# window-status-separator gap between window pills in the middle of the bar.
set -gF status-right '#{E:@catppuccin_status_ctp_folder}'
set -ag status-right ' '
set -agF status-right '#{E:@catppuccin_status_primary_ip}'
set -ag status-right ' '
set -agF status-right '#{E:@catppuccin_status_ctp_cpu}'
set -ag status-right ' '
set -agF status-right '#{E:@catppuccin_status_ctp_memory}'
# battery module only on machines that have one (macOS check)
if 'pmset -g batt 2>/dev/null | grep -q InternalBattery' {
  set -ag status-right ' '
  set -agF status-right '#{E:@catppuccin_status_battery}'
}
set -ag status-right ' '
set -ag status-right '#{E:@catppuccin_status_date_time}'

# The command prompt (prefix + :) and status line messages get their own pill in
# the middle of the bar. tmux draws both *on top of* the status line rather than
# in it, and catppuccin's message-style is 'align=centre' with no background,
# which left a bare unhighlighted ':' overlapping the session pill at the far
# left -- effectively invisible.
#
# In message-style, width= carves out a fixed-width *area* for the prompt,
# align= positions that area (left, centre or right of the client -- tmux offers
# no way to anchor it between two pills, so centre it is: on a wide client that
# lands in the empty space between the window pills and the widget pills), and
# fill= paints the area's background. The status line keeps showing through
# everywhere outside the area. fill is also what erases the previous frame:
# without it, backspaced characters and stale prompt text linger on the bar.
#
# Unlike most options, this one is parsed as a plain style rather than a format,
# so every value has to be a literal -- hence the -F sets below to bake the
# theme colours in, and hence the fixed width. 100 columns is a compromise: wide
# enough that a long message (a source-file error naming a file and line, say)
# is not truncated, narrow enough to sit inside the empty middle of the bar on a
# large client. tmux clamps it to the client width on a small one.
#
# Two quirks of the prompt shape the format below:
#   * the text being typed is always drawn at area_start + width(the expanded
#     message-format), ignoring the format's own alignment, so the pill has to
#     be laid out left-aligned inside the area (#[align=left]) -- under the
#     inherited align=centre the ':' and the input land in different places;
#   * anything placed after #{message} is overwritten by that input, so the
#     closing cap goes in its own right-aligned section, which lands on the
#     area's last column and gives the pill a fixed width to type into.
# Teal (unused by the status modules) keeps the pill distinguishable from the
# window and widget pills it floats between.
set -g @prompt_pill_style 'fg=#{E:@thm_teal},bg=#{E:@thm_surface_2},fill=#{E:@thm_surface_2},align=centre,width=100'
# command mode is only reachable with status-keys vi (this config uses emacs,
# above); peach instead of teal so landing in it accidentally is obvious
set -g @prompt_pill_command_style 'fg=#{E:@thm_peach},bg=#{E:@thm_surface_2},fill=#{E:@thm_surface_2},align=centre,width=100'
set -gF message-style '#{E:@prompt_pill_style}'
set -gF message-command-style '#{E:@prompt_pill_command_style}'
set -g message-format '#[#{?#{command_prompt},#{E:message-command-style},#{E:message-style}}]#[align=left]#[fg=#{?#{command_prompt},#{E:@thm_peach},#{E:@thm_teal}},bg=#{E:@thm_mantle}]#{E:@catppuccin_status_left_separator}#[fg=#{E:@thm_crust},bg=#{?#{command_prompt},#{E:@thm_peach},#{E:@thm_teal}}] #[fg=#{?#{command_prompt},#{E:@thm_peach},#{E:@thm_teal}},bg=#{E:@thm_surface_2}] #{message}#[align=right]#{E:@catppuccin_status_right_separator}'
# catppuccin hardcodes message-style/message-command-style with no opt-out, and
# tpm re-sources it in the background after this file has finished (and again on
# every prefix+r), which would clobber the two -F sets above -- hence keeping
# the real values in @prompt_pill_* options and re-applying them whenever
# anything writes an option. This does not re-fire itself: a command run from a
# hook doesn't trigger its own after hook.
set-hook -g after-set-option 'set -gF message-style "#{E:@prompt_pill_style}" ; set -gF message-command-style "#{E:@prompt_pill_command_style}"'

##############################################################################
# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run -b '~/.tmux/plugins/tpm/tpm'
